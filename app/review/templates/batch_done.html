{% extends "base.html" %}
{% block body %}
<section class="card center">
  <h2>Well done! 🎉</h2>
  <p>Batch finished. You have given <strong>{{ me.total }}</strong> answers in total, across {{ me.batches }} batches.</p>
  <form method="post" action="{{ url_for('batch_new') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="primary big">Next batch</button>
  </form>
  <p><a href="{{ url_for('mine') }}">My Work</a>{% if PHASE >= 2 %} · <a href="{{ url_for('others') }}">See others' work</a>{% endif %}</p>
</section>
{% endblock %}
