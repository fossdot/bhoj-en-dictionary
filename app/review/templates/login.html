{% extends "base.html" %}{% block title %}Login · भोज review{% endblock %}
{% block body %}
<section class="card narrow">
  <h2>Login</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="field"><span>Username</span><input name="username" autocomplete="username" required autofocus></label>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary wide">Login</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a> with the code from your school.</p>
</section>
{% endblock %}
