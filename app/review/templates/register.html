{% extends "base.html" %}{% block title %}Sign up · भोज review{% endblock %}
{% block body %}
<section class="card narrow">
  <h2>Create account</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="field"><span>Your name</span><input name="name" required autofocus></label>
    <label class="field"><span>Username (letters and digits, no spaces)</span><input name="username" autocomplete="username" required pattern="[A-Za-z_][A-Za-z0-9_]{2,}"></label>
    <label class="field"><span>Password (6+ characters)</span><input type="password" name="password" autocomplete="new-password" minlength="6" required></label>
    <label class="field"><span>Invite code</span><input name="invite" required></label>
    <button class="primary wide">Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Login</a>.</p>
</section>
{% endblock %}
